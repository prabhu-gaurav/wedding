<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sucheta &amp; Abhijeet – Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ee;--ink:#2a1f1a;--mute:#6f5f55;--card:#fffdf8;--line:#e6d6bd;--gold:#b97f12;--rose:#a8324f;--deep:#0f3d3a;--deep2:#0a2b29;--hero-ink:#f8ecd2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1f1e;--ink:#f3e8d2;--mute:#b9ad98;--card:#12302e;--line:#25504c;--gold:#e8b44c;--rose:#e27a95}}
:root[data-theme="dark"]{--bg:#0c1f1e;--ink:#f3e8d2;--mute:#b9ad98;--card:#12302e;--line:#25504c;--gold:#e8b44c;--rose:#e27a95}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:300 17px/1.7 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;line-height:1.1}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* hero */
.hero{min-height:100vh;min-height:100svh;background:radial-gradient(circle at 50% 38%,#16524d 0,var(--deep) 45%,var(--deep2) 100%);color:var(--hero-ink);display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:48px 20px 72px}
.mandala{position:absolute;left:50%;top:44%;width:min(135vw,980px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.5;pointer-events:none}
.mandala svg{width:100%;height:100%;animation:spin 240s linear infinite}
.mandala path,.mandala circle{fill:none;stroke:#e8b44c;stroke-width:1.1;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-in{position:relative;z-index:2;max-width:760px}
.hero-in>*{opacity:0;transform:translateY(14px);animation:up 1s ease-out forwards}
.hero-in>:nth-child(1){animation-delay:.1s}.hero-in>:nth-child(2){animation-delay:.2s}.hero-in>:nth-child(3){animation-delay:.3s}.hero-in>:nth-child(4){animation-delay:.4s}.hero-in>:nth-child(5){animation-delay:.5s}
@keyframes up{to{opacity:1;transform:none}}
.blessing{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.3rem;color:#e8b44c}
.names{font-size:clamp(3.2rem,12vw,7.5rem);margin:.2em 0 .1em}
.names span{display:block;font-style:italic;font-size:.4em;color:#e8b44c;margin:.1em 0}
.when{font-size:1.15rem;letter-spacing:.06em}
.count{display:flex;gap:clamp(14px,4vw,34px);justify-content:center;margin:34px 0 30px}
.count div{min-width:64px}
.count b{display:block;font:400 clamp(2rem,7vw,3.2rem)/1 "Cormorant Garamond",serif;font-variant-numeric:tabular-nums}
.count small{font-size:.8rem;opacity:.75}
.btn{display:inline-block;background:#e8b44c;color:#2a1a05;padding:13px 30px;border-radius:99px;text-decoration:none;font-weight:500;border:0;font:500 1rem Jost,sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.petal{position:absolute;top:-30px;width:12px;height:16px;background:#e27a95;border-radius:80% 0 80% 0;opacity:.7;animation:fall linear infinite;z-index:1}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}

/* sections */
section{padding:clamp(64px,10vw,120px) 20px}
.wrap{max-width:860px;margin:auto}
.head{text-align:center;margin-bottom:48px}
.head h2{font-size:clamp(2.2rem,6vw,3.4rem)}
.head p{color:var(--mute);margin-top:10px}
.orn{display:block;margin:16px auto 0;width:120px;height:14px}
.invite{text-align:center;font-family:"Cormorant Garamond",serif;font-size:clamp(1.4rem,3.6vw,2rem);line-height:1.5}
.invite em{color:var(--rose)}

/* timeline */
.tl{position:relative;padding-left:34px;list-style:none;padding-top:0}
.tl:before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:1px;background:var(--line)}
.ev{position:relative;margin-bottom:22px}
.ev:before{content:"";position:absolute;left:-31px;top:26px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);transition:background .3s,transform .3s}
.ev.open:before{background:var(--gold);transform:scale(1.25)}
.ev button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center}
.ev button:focus-visible{outline:2px solid var(--gold)}
.ev h3{font-size:1.7rem}
.ev .d{color:var(--gold);font-weight:500;font-size:.95rem}
.ev .chev{grid-row:1/3;grid-column:2;transition:transform .3s;color:var(--gold)}
.ev.open .chev{transform:rotate(180deg)}
.ev .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.ev.open .more{grid-template-rows:1fr}
.ev .more>div{overflow:hidden;padding:0 22px;color:var(--mute)}
.ev.open .more>div{padding:14px 22px 4px}
.ev .more p+p{margin-top:6px;color:var(--ink)}
.ev .box{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;margin-top:-8px;padding-top:8px}

/* venue */
.venue{background:var(--deep);color:var(--hero-ink)}
.venue .head p{color:#cdbf9f}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.arch{position:relative;width:100%;max-width:340px;margin:auto}
.arch svg{width:100%;height:auto;display:block}
.vtxt h3{font-size:2.2rem;margin-bottom:8px}
.vtxt p{margin-bottom:14px;opacity:.9}
.tips{list-style:none;padding:0;margin:0 0 24px;font-size:.95rem}
.tips li{padding:6px 0;border-top:1px solid #25504c}
 .arch-couple{position:absolute;inset:auto 17% 4%;width:66%;height:77%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 7px 12px #071e1b80)}
@media(max-width:720px){.vgrid{grid-template-columns:1fr}.vtxt{text-align:center}.venue-qr{margin-inline:auto}}

footer{text-align:center;padding:40px 20px 56px;color:var(--mute);font-family:"Cormorant Garamond",serif;font-size:1.2rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero-in>*{opacity:1;transform:none}.mandala path,.mandala circle{stroke-dashoffset:0}.petal{display:none}}

.couple-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(22px,6vw,74px);align-items:center}
.portrait{margin:auto;width:min(100%,330px);text-align:center}
.portrait-frame{position:relative;display:grid;place-items:center;aspect-ratio:4/5;isolation:isolate;overflow:hidden;border:5px double #e8b44c;border-radius:50% 50% 12px 12px / 34% 34% 12px 12px;background:radial-gradient(ellipse,#23665b,var(--deep2));color:var(--hero-ink)}
.portrait-frame span{font:2.6rem "Cormorant Garamond",Georgia,serif}
.portrait-frame img:not([hidden]){position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 36%;animation:portrait-in .7s ease both}
.portrait figcaption{font-size:.85rem;color:var(--mute);margin-top:.5rem}
.marathi{font:600 1rem system-ui,sans-serif;color:var(--rose);margin-bottom:.75rem}
.venue-qr{width:max-content;background:#fff;color:#25211d;text-align:center;border-radius:.5rem;padding:.55rem;margin-top:1.15rem}
.venue-qr img{display:block}.venue-qr figcaption{font-size:.82rem}
@keyframes portrait-in{from{transform:scale(1.14);opacity:.4}to{transform:none;opacity:1}}
@keyframes reveal-up{from{transform:translateY(38px);opacity:.3}to{transform:none;opacity:1}}
.reveal.arrived{animation:reveal-up .8s cubic-bezier(.2,.75,.25,1) both}
@media(max-width:580px){.couple-layout{grid-template-columns:1fr}.count div{min-width:0}.ev button{padding:15px 12px}.vgrid{gap:1.5rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="mandala" aria-hidden="true"><svg id="mandala" viewBox="-200 -200 400 400"></svg></div>
  <div class="hero-in">
    <p class="blessing" id="blessing"></p>
    <h1 class="names" id="names"></h1>
    <p class="when" id="when"></p>
    <div class="count" id="count" aria-live="off"></div>
    <a class="btn" href="#events">See the celebrations</a>
  </div>
</header>

<section>
  <div class="wrap couple-layout">
<figure class="portrait reveal"><div class="portrait-frame"><span aria-hidden="true">S &amp; A</span><img id="couple-photo" alt="Sample wedding portrait" hidden></div><figcaption id="photo-caption"></figcaption></figure>
<div class="invite reveal"><p lang="mr" class="marathi">सस्नेह निमंत्रण</p><div id="invite"></div></div>
</div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="head reveal" id="events"><h2>The celebrations</h2><p>Tap an event for the details.</p>

    <ul class="tl" id="tl"></ul>
  </div>
</section>

<footer id="foot"></footer>

<script>
/* ===== EDIT THIS BLOCK: all the wedding details live here ===== */
const W={
  bride:"Sucheta", groom:"Abhijeet",
  blessing:"॥ श्री गणेशाय नमः ॥",
  date:"2027-02-25T12:26:00+05:30",
  dateText:"25 February 2027",
  city:"Navi Mumbai",
  invite:"Together with our families, we invite you to celebrate our wedding and share your blessings.",
  venue:{name:"Shiv Banquet",addr:"Plot 8/9, Shiv Vishnu Mandir Marg, Juhu Nagar, Sector 9/A, Vashi, Navi Mumbai 400703",map:"https://www.google.com/maps/search/?api=1&query=Shiv%20Banquet%20Plot%208%2F9%2C%20Shiv%20Vishnu%20Mandir%20Marg%2C%20Juhu%20Nagar%2C%20Sector%209%2FA%2C%20Vashi%2C%20Navi%20Mumbai%20400703"},
  // Set src to "./couple.jpg" and sample to false when adding the real photo.
  photo:{src:"https://prabhu-gaurav.github.io/wedding/couple.webp",sample:true},
  events:[
    {name:"Haldi",day:"Tuesday, 23 February",time:"5:00 PM",note:"हळदी समारंभ · At the family home"},
    {name:"Wedding",day:"Thursday, 25 February",time:"12:26 PM",note:"विवाह मुहूर्त · Shiv Banquet, Vashi"},
    {name:"Reception",day:"Thursday, 25 February",time:"1:00–3:00 PM",note:"स्नेह भोजन व स्वागत समारंभ · Lunch and reception at Shiv Banquet, Vashi"}
  ]
};
/* ============================================================ */

const $=s=>document.querySelector(s);
document.title=W.bride+" & "+W.groom+" – Wedding";
$("#blessing").textContent=W.blessing;
$("#names").innerHTML=W.bride+"<span>&</span>"+W.groom;
$("#when").textContent=W.dateText+" · "+W.city;
$("#invite").innerHTML=W.invite;
$("#vname").textContent=W.venue.name;$("#vaddr").textContent=W.venue.addr;
$("#vsub").textContent=W.city;
$("#map").href=W.venue.map;
const portrait=$("#couple-photo");
portrait.alt=W.photo.sample?"Sample wedding portrait":W.bride+" and "+W.groom;
portrait.addEventListener("load",()=>{portrait.hidden=false;$("#photo-caption").hidden=!W.photo.sample;});
portrait.addEventListener("error",()=>{$("#photo-caption").textContent="Couple photo to come";});
if(W.photo.src) portrait.src=W.photo.src;
$("#foot").textContent=W.bride+" & "+W.groom+" · "+W.dateText;

/* mandala */
(function(){
  const s=$("#mandala");let h="";
  const ring=(n,r,len,wid)=>{let o="";for(let i=0;i<n;i++){const a=360/n*i;
    o+=`<path pathLength="1" transform="rotate(${a}) translate(0 ${-r})" d="M0 0C${wid} ${-len*.3} ${wid} ${-len*.8} 0 ${-len}C${-wid} ${-len*.8} ${-wid} ${-len*.3} 0 0Z" style="animation-delay:${i*0.04}s"/>`}return o};
  h+=ring(12,20,48,16)+ring(18,70,50,13)+ring(24,120,56,12)+ring(36,168,28,8);
  [20,70,120,168,196].forEach((r,i)=>h+=`<circle pathLength="1" r="${r}" style="animation-delay:${i*.3}s"/>`);
  s.innerHTML=h;
  /* garland on arch */
  let g="";for(let i=0;i<19;i++){const t=Math.PI*i/18,x=150-120*Math.cos(t),y=150-120*Math.sin(t);
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i%2?5:7}" fill="${i%2?"#e8b44c":"#e27a95"}"/>`}
  $("#garland").innerHTML=g;
  /* petals */
  const hero=$(".hero");
  for(let i=0;i<14;i++){const p=document.createElement("i");p.className="petal";
    p.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*9}s;animation-delay:${3+Math.random()*10}s;transform:scale(${.6+Math.random()*.7})`;
    hero.appendChild(p)}
})();

/* countdown */
const target=new Date(W.date).getTime();
function tick(){
  let d=Math.max(0,target-Date.now());
  const v=[["Days",864e5],["Hours",36e5],["Minutes",6e4],["Seconds",1e3]].map(([l,m])=>{const n=Math.floor(d/m);d-=n*m;return`<div><b>${String(n).padStart(2,"0")}</b><small>${l}</small></div>`});
  $("#count").innerHTML=v.join("");
}
tick();setInterval(tick,1000);

/* events */
$("#tl").innerHTML=W.events.map((e,i)=>`<li class="ev reveal" id="ev${i}">
  <button aria-expanded="false"><h3>${e.name}</h3><span class="d">${e.day} · ${e.time}</span>
  <svg class="chev" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l6 6 6-6"/></svg></button>
  <div class="more"><div class="box"><p>${e.note}</p></div></div></li>`).join("");
document.querySelectorAll(".ev button").forEach(b=>b.onclick=()=>{
  const li=b.parentElement,o=!li.classList.contains("open");
  li.classList.toggle("open",o);b.setAttribute("aria-expanded",o);
});
document.querySelector(".ev button").click();

if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const reveals=new IntersectionObserver((entries,observer)=>{
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      entry.target.classList.add("arrived");
      observer.unobserve(entry.target);
    }
  },{threshold:.16});
  document.querySelectorAll(".reveal").forEach(element=>reveals.observe(element));
}
</script>
